<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inkwell — Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="wordmark">Ink<span>well</span></div>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <span data-auth-slot style="display:contents"></span>
    </nav>
  </div>
</header>

<main class="container">
  <h1>Create your account</h1>
  <p class="form-note" style="margin-bottom:24px;">Already have one? <a href="login.html">Log in instead</a>.</p>

  <div class="error-message" id="errorBox"></div>

  <form class="stack" id="registerForm">
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required minlength="6">
      <p class="form-note">At least 6 characters.</p>
    </div>
    <div class="field">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" required minlength="6">
    </div>
    <button type="submit" class="btn-primary">Create account</button>
  </form>
</main>

<script src="script.js"></script>
<script>
  document.getElementById('registerForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const errorBox = document.getElementById('errorBox');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    if (password !== confirm) {
      showError('Passwords do not match.');
      return;
    }

    const users = getUsers();
    if (users.some(u => u.email === email)) {
      showError('An account with this email already exists.');
      return;
    }

    users.push({ name, email, password });
    saveUsers(users);
    setSession(email);
    location.href = 'dashboard.html';
  });
</script>

</body>
</html>
