!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inkwell — Edit post</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="wordmark">Ink<span>well</span></div>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <span data-auth-slot style="display:contents"></span>
    </nav>
  </div>
</header>

<main class="container" id="formRoot" style="display:none;">
  <h1>Edit post</h1>

  <div class="error-message" id="errorBox"></div>

  <form class="stack" id="postForm" style="max-width:600px;">
    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title" required>
    </div>
    <div class="field">
      <label for="content">Content</label>
      <textarea id="content" required></textarea>
    </div>
    <div class="field">
      <label for="category">Category</label>
      <select id="category" class="filter-input" style="width:100%;"></select>
    </div>
    <div>
      <button type="submit" class="btn-primary" id="submitBtn">Save changes</button>
      <a href="dashboard.html" class="btn btn-outline" style="margin-left:10px;">Cancel</a>
    </div>
  </form>
</main>
<script src="script.js"></script>
<script>
    const params = new URLSearchParams(location.search);
    const postId = params.get('id');
    document.addEventListener('DOMContentLoaded',async function(){
        const user = await requireLogin();
        if(!user) return;
        if(!postId){
            location.href='dashboard.html';
            return;
        }
        try{
            const [post, categories]= await Promise.all([
                apiRequest(`/posts/${postId}`),
                apiRequest('/posts/meta/categories')
            ]);
            document.getElementById('category').innerHTML= categories.map(c => `<option value="${c=== post.category ? 'selected':''}>${c}</option>`).join('');
            document.getElementById('title').value = post.title;
            document.getElementById('content').value= post.content;
            document.getElementById('formRoot').style.display='block';
        }catch (err){
            document.getElementById('errorBox').textContent = err.message;
            document.getElementById('errorBox').style.display ='block';
            document.getElementById('formRoot').style.display='block';
        }
    });
    document.getElementById('postForm').addEventListener('submit', async function(e){
        e.preventDefault();
        const title = document.getElementById('title').value.trim();
        const content = document.getElementById('content').value.trim();
        const category = document.getElementById('category').value;
        const errorBox = document.getElementById('errorBox');
        const submitBtn = document.getElementById('submitBtn');

        errorBox.style.display='none';
        submitBtn.disabled = true;
        submitBtn.textContent ='Saving...';
        try{
            await apiRequest(`/posts/${postId}`,{
                method:'PUT',
                body:JSON.stringify({title, content,category})
            });
            location.href ='dashboard.html';
        }catch(err){
            errorBox.textContent= err.message;
            errorBox.style.display='block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Save changes';
        }
    });
</script>
</body>
</html>
