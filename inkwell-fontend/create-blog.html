<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>Inkwell - Write a post</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="masthead">
            <div class="masthead-inner">
            <div class="wordmark">Ink<span>well</span></div>
            <nav class="site-nav">
                <a href="index.html">Home</a>
                <span data-auth-slot style="display:contents"></span>
            </nav>
            </div>
        </header>
        <main class="container" id="formRoot" style="display:none;">
            <h1>Write a post</h1>
            <form  class="stack" id="postForm" style="max-width: 600px;">
                <div class="field">
                <label for="title">Title:</label>
                <input type="text" id="title" " required>
                </div>
                <div class="field">
                <label for="content">Content:</label>
                <textarea id="content" required></textarea>
                </div>
                <div>
                <button type="submit" class=" btn-primary">Publish Post</button>
                <a href="dashboard.html"class="btn btn-outline" style="margin-left: 10px;">Cancel</a>
                </div>
            </form>
            </main>

            <script src="script.js"></script>
            <script>
                document.addEventListener('DOMContentLoaded',function(){
                    const user=currentUser();
                    if(!user){
                        location.href='login.html';
                        return;
                    }
                    document.getElementById('formRoot').style.display='block';
                });
                document.getElementById('postForm').addEventListener('submit',function(e){
                    e.preventDefault();
                    const user=currentUser();
                    const title=document.getElementById('title').value.trim();
                    const content=document.getElementById('content').value.trim();
                    const posts=getPosts();
                    posts.push({
                        id:'post-'+Date.now(),
                        title,
                        content,
                        author:user.name,
                        date:new Date().toISOString().slice(0,10)
                    });
                    savePosts(posts);
                    location.href='dashboard.html';
                });
            </script>
    </body>
</html>
