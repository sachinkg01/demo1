<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inkwell - Home</title>
        <link rel="stylesheet" href="style.css">
        </head>
    <body>
        <header class="masthead">
            <div class="masthead-inner">
            <div class="wordmark">Ink<span>well</span></div>
            <nav class="site-nav">
                <a href="index.html">Home</a>
                <span data-auth-slot style="display:contents"></span>
            </nav>
            </div>
        </header>
        <main class="container">
            <div id="postList"></div>
        </main>

        <script src="script.js"></script>
        <script>
            function renderPosts(){
                const posts=getPosts().slice().sort((a,b)=> new Date(b.date)-new Date(a.date));
                const list=document.getElementById('postList');
                if(posts.length===0){
                    list.innerHTML='<div class="empty-state">No posts yet.<a href="create-blog.html" class="btn btn-primary">Be the first to write one!</a></div>';
                    return;
                }
                list.innerHTML = posts.map(p => `
      <article class="post-entry">
        <div class="post-meta">${formatDate(p.date)} · ${p.author}</div>
        <h2><a href="post.html?id=${p._id}">${escapeHTML(p.title)}</a></h2>
        <p class="post-excerpt">${escapeHTML(p.content).slice(0, 160)}${p.content.length > 160 ? '…' : ''}</p>
      </article>
    `).join('');
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.addEventListener('DOMContentLoaded', renderPosts);
</script>
    </body>
</html>
