<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inkwell - Home</title>
        <link rel="stylesheet" href="style.css">
        </head>
    <body>
        <header class="masthead">
            <div class="masthead-inner">
            <div class="wordmark">Ink<span>well</span></div>
            <nav class="site-nav">
                <a href="index.html">Home</a>
                <span data-auth-slot style="display:contents"></span>
            </nav>
            </div>
        </header>
        <main class="container">
            <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="Search posts.." class="filter-input">
                <select id="categorySelect" class="filter-input"></select>
            </div>
            <div id="postList">
                <p class="form-note">Loading posts..</p>
            </div>
        </main>

        <script src="script.js"></script>
        <script>
            let debounceTimer;
            async function loadCategories(){
                const select = document.getElementById('categoryselect');
                try{
                    const categories = await apiRequest('/posts/meta/ctegories');
                    select.innerHTML='<option value ="All">All categories</option>'
                    +categories.map(c=> `<option value ="${c}">${c}</option>`).join('');
                }catch(err){
                    select.innerHTML='<option value = "All">All categories</option>';
                }
            }
            async function renderPosts(){
                const list = document.getElementById('postList');
                const search = document.getElementById('searchInput').value.trim();
                const category = document.getElementById('categorySelect').value;

                const params =new URLSearchParams();
                if(search) params.set('search', search);
                if(category && category !=='All')params.set('category', category);
            try{
                const posts=getPosts().slice().sort((a,b)=> new Date(b.date)-new Date(a.date));
                const list=document.getElementById('postList');
                if(posts.length===0){
                    list.innerHTML='<div class="empty-state">No posts yet.<a href="create-blog.html" class="btn btn-primary">Be the first to write one!</a></div>';
                    return;
                }
                list.innerHTML = posts.map(p => `
      <article class="post-entry">
        <div class="post-meta">${formatDate(p.date)} · ${p.author}</div>
        <h2><a href="post.html?id=${p._id}">${escapeHTML(p.title)}</a></h2>
        <p class="post-excerpt">${escapeHTML(p.content).slice(0, 160)}${p.content.length > 160 ? '…' : ''}</p>
      </article>
    `).join('');
  }catch(err){
    list.innerHTML=`<div class ="error-message" style="display:block;">Could not load posts: ${escapeHTML(err.message)}. Is the backend server running?</div>`;
  }
}

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.addEventListener('DOMContentLoaded', async()=>{
    await loadCategories();
    await renderPosts();

    document.getElementById('searchInput').addEventListener('input',()=>{
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(renderPosts, 300);
    });
    document.getElementById('categorySelect').addEventListener('change',renderPosts);
  });
</script>
    </body>
</html>
